<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="520" height="80">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120826"/>
      <stop offset="100%" stop-color="#0a0414"/>
    </linearGradient>
    <linearGradient id="arc-outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="arc-mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0d4ff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="vault-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(0, 0)">
    <rect width="80" height="80" rx="16" fill="url(#bg)"/>
    <g transform="translate(40,40)">
      <path d="M 9,-22 A 25,25 0 1,0 9,22" fill="none" stroke="url(#arc-outer)" stroke-width="5" stroke-linecap="round"/>
      <path d="M 6,-15 A 17,17 0 1,0 6,15" fill="none" stroke="url(#arc-mid)" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
      <path d="M 4,-8.5 A 10,10 0 1,0 4,8.5" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
      <circle cx="-1.5" cy="0" r="2" fill="#e0d4ff" opacity="0.9"/>
    </g>
  </g>

  <!-- Wordmark text -->
  <text x="96" y="52" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="url(#text-grad)" letter-spacing="2">CADENCEA</text>
  <text x="370" y="52" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="36" font-weight="300" fill="url(#vault-grad)" letter-spacing="3">VAULT</text>
</svg>
