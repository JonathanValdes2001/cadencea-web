<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120826"/>
      <stop offset="100%" stop-color="#0a0414"/>
    </linearGradient>
    <linearGradient id="arc-outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="arc-mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)" filter="url(#glow)">
    <!-- Outer arc - the C -->
    <path d="M 60,-140 A 160,160 0 1,0 60,140" fill="none" stroke="url(#arc-outer)" stroke-width="28" stroke-linecap="round"/>
    <!-- Middle arc -->
    <path d="M 40,-95 A 110,110 0 1,0 40,95" fill="none" stroke="url(#arc-mid)" stroke-width="20" stroke-linecap="round" opacity="0.7"/>
    <!-- Inner arc -->
    <path d="M 25,-55 A 65,65 0 1,0 25,55" fill="none" stroke="#7c3aed" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
    <!-- Center dot -->
    <circle cx="-10" cy="0" r="12" fill="#e0d4ff" opacity="0.9"/>
  </g>
</svg>
