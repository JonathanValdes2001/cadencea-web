<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512">
  <defs>
    <linearGradient id="arc-outer-bw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <linearGradient id="arc-mid-bw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8b8b8"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#585858"/>
    </linearGradient>
    <filter id="glow-bw">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(200,200)" filter="url(#glow-bw)">
    <path d="M 60,-140 A 160,160 0 1,0 60,140" fill="none" stroke="url(#arc-outer-bw)" stroke-width="28" stroke-linecap="round"/>
    <path d="M 40,-95 A 110,110 0 1,0 40,95" fill="none" stroke="url(#arc-mid-bw)" stroke-width="20" stroke-linecap="round" opacity="0.7"/>
    <path d="M 25,-55 A 65,65 0 1,0 25,55" fill="none" stroke="#606060" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
    <circle cx="-10" cy="0" r="12" fill="#f0f0f0" opacity="0.9"/>
  </g>
</svg>
