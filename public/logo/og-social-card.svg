<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#140a28"/>
      <stop offset="100%" stop-color="#08030f"/>
    </linearGradient>
    <linearGradient id="oo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="om" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="otg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0d4ff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="ovg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="ogl">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#obg)"/>
  <!-- Subtle grid lines for texture -->
  <g opacity="0.03" stroke="#a78bfa" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>
  <!-- Icon -->
  <g transform="translate(600,260)" filter="url(#ogl)">
    <path d="M 40,-95 A 110,110 0 1,0 40,95" fill="none" stroke="url(#oo)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 28,-65 A 75,75 0 1,0 28,65" fill="none" stroke="url(#om)" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
    <path d="M 18,-38 A 44,44 0 1,0 18,38" fill="none" stroke="#7c3aed" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
    <circle cx="-7" cy="0" r="8" fill="#e0d4ff" opacity="0.9"/>
  </g>
  <!-- Text -->
  <text x="600" y="440" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="52" font-weight="700" fill="url(#otg)" letter-spacing="6">CADENCEA</text>
  <text x="600" y="490" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="28" font-weight="300" fill="url(#ovg)" letter-spacing="10">VAULT</text>
  <!-- Tagline -->
  <text x="600" y="540" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',sans-serif" font-size="16" fill="#5a5073" letter-spacing="3">PROFESSIONAL MUSIC PROJECT MANAGEMENT</text>
</svg>